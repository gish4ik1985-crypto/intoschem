# Публикация игры на GitHub Pages. Выкладывается только сама игра (index.html,
# style.css, js/), без тестов, снимков экрана и заметок для разработки.
#
# Один раз в настройках репозитория: Settings -> Pages -> Source = "GitHub Actions".

name: Публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Ненулевой код возврата — появилось НОВОЕ замечание. Сломанную игру
      # лучше не выкладывать, чем выложить.
      - run: node web/tests/run.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Собрать папку сайта
        run: |
          mkdir _site
          cp web/index.html web/style.css _site/
          cp -r web/js _site/js
      # GitHub Pages отдаёт файлы с Cache-Control: max-age=600, и обычное
      # обновление страницы на планшете тянет старые js и css из кэша: правка
      # выложена, а игрок её не видит. Номер коммита в адресе каждого файла
      # делает адрес новым при каждой публикации.
      - name: Версия в адресах файлов
        run: |
          V="${GITHUB_SHA::7}"
          sed -i -E "s#(src=\"js/[^\"?]+)\"#\1?v=$V\"#g; s#(href=\"style\.css)\"#\1?v=$V\"#" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
